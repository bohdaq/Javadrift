name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check validatePlugins --no-daemon

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check docs with published Javadrift
        uses: bohdaq/Javadrift/javadrift-action@v0.1.0
        with:
          version: v0.1.0
          warn-only: 'true'
          format: sarif
          output: javadrift.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javadrift-documentation-report
          path: javadrift.sarif
          if-no-files-found: error
