name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
  cli-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the packaged CLI
        run: mvn -B -DskipTests -pl javadrift-cli -am package
      - name: Check native CLI paths, reports and Git history
        run: python scripts/smoke-cli.py --output validation-results/cli-portability.json
      - name: Save CLI portability reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            validation-results/cli-portability.json
            validation-results/cli-portability-logs/
          if-no-files-found: warn

  optional-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build packaged CLI
        run: mvn -B -DskipTests -pl javadrift-cli -am package
      - name: Check optional snippet and property scenarios
        run: python scripts/smoke-optional-checks.py --skip-build --output validation-results/optional-checks.json
      - name: Save optional checks reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-checks-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            validation-results/optional-checks.json
            validation-results/optional-checks-logs/
          if-no-files-found: warn

  optional-plugins:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install the sample compilation toolchain
        if: matrix.java == '21'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check optional rules through Maven and Gradle
        run: python scripts/smoke-optional-plugins.py --output validation-results/optional-plugins.json
      - name: Save optional adapter reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-plugins-java-${{ matrix.java }}
          path: |
            validation-results/optional-plugins.json
            validation-results/optional-plugins-logs/
          if-no-files-found: warn

  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check validatePlugins --no-daemon

  kotlin-compatibility:
    strategy:
      fail-fast: false
      matrix:
        kotlin: ['2.2.21', '2.3.21', '2.4.20']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check mixed Java and Kotlin adoption
        run: >-
          python3 scripts/smoke-sample.py --gradle-only
          --kotlin-version '${{ matrix.kotlin }}'
          --output 'validation-results/kotlin-${{ matrix.kotlin }}.json'
      - name: Save Kotlin compatibility reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-gradle-${{ matrix.kotlin }}
          path: |
            validation-results/kotlin-${{ matrix.kotlin }}.json
            validation-results/kotlin-${{ matrix.kotlin }}-logs/
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check docs with published Javadrift
        uses: bohdaq/Javadrift/javadrift-action@v0.2.0
        with:
          version: v0.2.0
          warn-only: 'true'
          format: sarif
          output: javadrift.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javadrift-documentation-report
          path: javadrift.sarif
          if-no-files-found: error

  sample-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise local CLI, Maven and Gradle adoption
        run: python3 scripts/smoke-sample.py --output validation-results/sample-smoke.json
      - name: Save sample reports and command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-adoption-reports
          path: |
            validation-results/sample-smoke.json
            validation-results/sample-smoke-logs/
          if-no-files-found: warn
