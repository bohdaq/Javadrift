name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - run: |
          mkdir -p release
          cp javadrift-cli/target/javadrift.jar release/
          cd release
          sha256sum javadrift.jar > javadrift.jar.sha256
      - name: Publish CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/javadrift.jar release/javadrift.jar.sha256 --verify-tag --generate-notes
